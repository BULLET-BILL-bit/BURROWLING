<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burrow Generator</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #181818;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-top: 0;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 10px 20px;
        max-width: 700px;
        margin-bottom: 20px;
    }

    .control {
        display: grid;
        grid-template-columns: 1fr 70px 70px;
        gap: 6px;
        align-items: center;
    }

    .control label {
        font-size: 14px;
    }

    input {
        width: 60px;
        box-sizing: border-box;
        background: #292929;
        color: white;
        border: 1px solid #555;
        padding: 5px;
    }

    button {
        background: #ddd;
        color: #111;
        border: 0;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
    }

    button:hover {
        background: white;
    }

    #stats {
        margin-bottom: 15px;
        font-size: 14px;
        color: #aaa;
    }

    #canvas {
        width: 1024px;
        height: 1024px;
        max-width: 90vw;
        max-height: 90vw;
        image-rendering: pixelated;
        border: 1px solid #444;
        display: block;
    }
</style>
</head>

<body>

<h1>Burrow Generator</h1>

<div class="controls">

    <div class="control">
        <label>Numero stanze</label>
        <input id="roomsMin" type="number" value="6">
        <input id="roomsMax" type="number" value="18">
    </div>

    <div class="control">
        <label>Altezza sopra</label>
        <input id="upMin" type="number" value="0">
        <input id="upMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Altezza sotto</label>
        <input id="downMin" type="number" value="0">
        <input id="downMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Distanza destra</label>
        <input id="rightMin" type="number" value="0">
        <input id="rightMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Distanza sinistra</label>
        <input id="leftMin" type="number" value="0">
        <input id="leftMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Corridoi extra %</label>
        <input id="extraMin" type="number" value="0">
        <input id="extraMax" type="number" value="25">
    </div>

</div>

<button onclick="generate()">GENERA BURROW</button>

<div id="stats"></div>

<canvas id="canvas" width="1024" height="1024"></canvas>


<script>

const GRID = 32;
const TILE = 32;

const EMPTY = 0;
const ROOM = 1;
const CORRIDOR = 2;


// ------------------------------------------------------------
// UTILITÀ
// ------------------------------------------------------------

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomFloat(min, max) {
    return Math.random() * (max - min) + min;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function createMatrix(value = EMPTY) {
    return Array.from(
        { length: GRID },
        () => Array(GRID).fill(value)
    );
}


// ------------------------------------------------------------
// LETTURA PARAMETRI
// ------------------------------------------------------------

function getSettings() {

    function range(minId, maxId) {
        let min = Number(document.getElementById(minId).value);
        let max = Number(document.getElementById(maxId).value);

        if (min > max) {
            [min, max] = [max, min];
        }

        return { min, max };
    }

    return {
        rooms: range("roomsMin", "roomsMax"),
        up: range("upMin", "upMax"),
        down: range("downMin", "downMax"),
        right: range("rightMin", "rightMax"),
        left: range("leftMin", "leftMax"),
        extra: range("extraMin", "extraMax")
    };
}


// ------------------------------------------------------------
// GENERAZIONE STANZE
// ------------------------------------------------------------

function generateRooms(settings) {

    const roomMatrix = createMatrix();
    const rooms = [];

    const targetRooms = randomInt(
        settings.rooms.min,
        settings.rooms.max
    );

    let attempts = 0;
    const maxAttempts = 5000;

    while (
        rooms.length < targetRooms &&
        attempts < maxAttempts
    ) {

        attempts++;

        const up = randomInt(
            settings.up.min,
            settings.up.max
        );

        const down = randomInt(
            settings.down.min,
            settings.down.max
        );

        const left = randomInt(
            settings.left.min,
            settings.left.max
        );

        const right = randomInt(
            settings.right.min,
            settings.right.max
        );

        /*
            Il centroide è una cella vera e propria.

            Esempio:
            left  = 2
            right = 1
            up    = 1
            down  = 2

            La stanza occupa:

            x-2 ... x ... x+1
            y-1 ... y ... y+2
        */

        const minX = left + 1;
        const maxX = GRID - right - 2;

        const minY = up + 1;
        const maxY = GRID - down - 2;

        if (minX > maxX || minY > maxY) {
            continue;
        }

        const cx = randomInt(minX, maxX);
        const cy = randomInt(minY, maxY);

        const cells = [];

        let valid = true;

        for (let y = cy - up; y <= cy + down; y++) {
            for (let x = cx - left; x <= cx + right; x++) {

                if (
                    x < 0 ||
                    x >= GRID ||
                    y < 0 ||
                    y >= GRID
                ) {
                    valid = false;
                    break;
                }

                /*
                    Lasciamo una cella vuota attorno alle stanze.
                    Questo evita che due stanze si fondano.
                */
                for (let yy = y - 1; yy <= y + 1; yy++) {
                    for (let xx = x - 1; xx <= x + 1; xx++) {

                        if (
                            xx >= 0 &&
                            xx < GRID &&
                            yy >= 0 &&
                            yy < GRID &&
                            roomMatrix[yy][xx] === ROOM
                        ) {
                            valid = false;
                        }
                    }
                }

                cells.push([x, y]);
            }

            if (!valid) break;
        }

        if (!valid) continue;

        for (const [x, y] of cells) {
            roomMatrix[y][x] = ROOM;
        }

        rooms.push({
            x: cx,
            y: cy,
            up,
            down,
            left,
            right
        });
    }

    return {
        matrix: roomMatrix,
        rooms
    };
}


// ------------------------------------------------------------
// DELAUNAY
// ------------------------------------------------------------

function circumcircle(a, b, c) {

    const A = b.x - a.x;
    const B = b.y - a.y;
    const C = c.x - a.x;
    const D = c.y - a.y;

    const E = A * (a.x + b.x) + B * (a.y + b.y);
    const F = C * (a.x + c.x) + D * (a.y + c.y);

    const G = 2 * (A * (c.y - b.y) - B * (c.x - b.x));

    if (Math.abs(G) < 0.000001) {
        return null;
    }

    const ux = (D * E - B * F) / G;
    const uy = (A * F - C * E) / G;

    const dx = ux - a.x;
    const dy = uy - a.y;

    return {
        x: ux,
        y: uy,
        r2: dx * dx + dy * dy
    };
}


function delaunay(points) {

    if (points.length < 2) return [];

    if (points.length === 2) {
        return [{
            a: 0,
            b: 1
        }];
    }

    const pts = points.map((p, i) => ({
        x: p.x,
        y: p.y,
        original: i
    }));

    const superA = {
        x: -1000,
        y: -1000,
        original: -1
    };

    const superB = {
        x: 1000,
        y: -1000,
        original: -2
    };

    const superC = {
        x: 0,
        y: 1000,
        original: -3
    };

    pts.push(superA, superB, superC);

    const n = points.length;

    let triangles = [
        [n, n + 1, n + 2]
    ];

    for (let i = 0; i < n; i++) {

        const p = pts[i];

        const bad = [];

        for (let t = 0; t < triangles.length; t++) {

            const tri = triangles[t];

            const circle = circumcircle(
                pts[tri[0]],
                pts[tri[1]],
                pts[tri[2]]
            );

            if (!circle) continue;

            const dx = p.x - circle.x;
            const dy = p.y - circle.y;

            if (
                dx * dx + dy * dy <=
                circle.r2 + 0.000001
            ) {
                bad.push(t);
            }
        }

        const edgeMap = new Map();

        for (const tIndex of bad) {

            const tri = triangles[tIndex];

            const edges = [
                [tri[0], tri[1]],
                [tri[1], tri[2]],
                [tri[2], tri[0]]
            ];

            for (const edge of edges) {

                const a = Math.min(edge[0], edge[1]);
                const b = Math.max(edge[0], edge[1]);

                const key = `${a}-${b}`;

                edgeMap.set(
                    key,
                    (edgeMap.get(key) || 0) + 1
                );
            }
        }

        triangles = triangles.filter(
            (_, index) => !bad.includes(index)
        );

        for (const [key, count] of edgeMap) {

            if (count !== 1) continue;

            const [a, b] = key.split("-").map(Number);

            triangles.push([a, b, i]);
        }
    }

    const edges = new Set();

    for (const tri of triangles) {

        if (
            tri[0] >= n ||
            tri[1] >= n ||
            tri[2] >= n
        ) {
            continue;
        }

        const triEdges = [
            [tri[0], tri[1]],
            [tri[1], tri[2]],
            [tri[2], tri[0]]
        ];

        for (const [a, b] of triEdges) {

            const min = Math.min(a, b);
            const max = Math.max(a, b);

            edges.add(`${min}-${max}`);
        }
    }

    return [...edges].map(key => {

        const [a, b] = key.split("-").map(Number);

        return { a, b };
    });
}


// ------------------------------------------------------------
// DISTANZA
// ------------------------------------------------------------

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);
}


// ------------------------------------------------------------
// MINIMUM SPANNING TREE
// ------------------------------------------------------------

function minimumSpanningTree(edges, rooms) {

    const sorted = [...edges].sort((e1, e2) => {

        const d1 = distance(
            rooms[e1.a],
            rooms[e1.b]
        );

        const d2 = distance(
            rooms[e2.a],
            rooms[e2.b]
        );

        return d1 - d2;
    });

    const parent = rooms.map((_, i) => i);

    function find(x) {

        while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
        }

        return x;
    }

    function union(a, b) {

        const ra = find(a);
        const rb = find(b);

        if (ra === rb) {
            return false;
        }

        parent[rb] = ra;

        return true;
    }

    const mst = [];

    for (const edge of sorted) {

        if (union(edge.a, edge.b)) {
            mst.push(edge);
        }
    }

    return mst;
}


// ------------------------------------------------------------
// CORRIDOI
// ------------------------------------------------------------

function drawCorridor(matrix, a, b) {

    /*
        IMPORTANTE:

        Il corridoio parte dal CENTROIDE
        e arriva al CENTROIDE.

        Prima percorre X.
        Poi percorre Y.

        Ogni cella attraversata viene scritta
        nella corridorMatrix.
    */

    let x = a.x;
    let y = a.y;

    matrix[y][x] = CORRIDOR;

    // Orizzontale
    while (x !== b.x) {

        if (x < b.x) {
            x++;
        } else {
            x--;
        }

        matrix[y][x] = CORRIDOR;
    }

    // Verticale
    while (y !== b.y) {

        if (y < b.y) {
            y++;
        } else {
            y--;
        }

        matrix[y][x] = CORRIDOR;
    }
}


function generateCorridors(rooms, delaunayEdges, mst, settings) {

    const corridorMatrix = createMatrix();

    /*
        Prima disegniamo tutti i corridoi dell'MST.
        Questi garantiscono la connessione completa.
    */

    for (const edge of mst) {

        drawCorridor(
            corridorMatrix,
            rooms[edge.a],
            rooms[edge.b]
        );
    }

    /*
        Gli altri archi Delaunay sono candidati
        per i corridoi extra.
    */

    const mstKeys = new Set(
        mst.map(e => {
            const a = Math.min(e.a, e.b);
            const b = Math.max(e.a, e.b);
            return `${a}-${b}`;
        })
    );

    const excluded = delaunayEdges.filter(e => {

        const a = Math.min(e.a, e.b);
        const b = Math.max(e.a, e.b);

        return !mstKeys.has(`${a}-${b}`);
    });

    /*
        Percentuale casuale compresa tra Min e Max.
    */

    const percentage = randomFloat(
        settings.extra.min,
        settings.extra.max
    );

    const extraCount = Math.floor(
        excluded.length * percentage / 100
    );

    shuffle(excluded);

    const extras = excluded.slice(
        0,
        extraCount
    );

    for (const edge of extras) {

        drawCorridor(
            corridorMatrix,
            rooms[edge.a],
            rooms[edge.b]
        );
    }

    return {
        matrix: corridorMatrix,
        extraCount,
        percentage
    };
}


// ------------------------------------------------------------
// MATRICE FINALE
// ------------------------------------------------------------

function combineMatrices(roomMatrix, corridorMatrix) {

    /*
        Si parte dalle stanze.

        Se nella corridorMatrix c'è un corridoio,
        esso SOVRASCRIVE quello che c'era prima.

        Quindi:
        vuoto     -> corridoio
        stanza    -> corridoio
    */

    const finalMatrix = roomMatrix.map(
        row => [...row]
    );

    for (let y = 0; y < GRID; y++) {

        for (let x = 0; x < GRID; x++) {

            if (corridorMatrix[y][x] === CORRIDOR) {
                finalMatrix[y][x] = CORRIDOR;
            }
        }
    }

    return finalMatrix;
}


// ------------------------------------------------------------
// RENDER
// ------------------------------------------------------------

function render(matrix, rooms) {

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Sfondo
    ctx.fillStyle = "#111";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Celle
    for (let y = 0; y < GRID; y++) {

        for (let x = 0; x < GRID; x++) {

            const value = matrix[y][x];

            if (value === ROOM) {

                ctx.fillStyle = "#ddd";

                ctx.fillRect(
                    x * TILE,
                    y * TILE,
                    TILE,
                    TILE
                );

            } else if (value === CORRIDOR) {

                ctx.fillStyle = "#777";

                ctx.fillRect(
                    x * TILE,
                    y * TILE,
                    TILE,
                    TILE
                );
            }
        }
    }

    /*
        Griglia molto leggera, utile durante il prototipo.
    */

    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= GRID; i++) {

        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, GRID * TILE);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(GRID * TILE, i * TILE);
        ctx.stroke();
    }

    /*
        Centroidi.

        Li lasciamo visibili per verificare che
        il corridoio arrivi effettivamente al centro.
    */

    for (const room of rooms) {

        ctx.fillStyle = "#d22";

        ctx.beginPath();

        ctx.arc(
            room.x * TILE + TILE / 2,
            room.y * TILE + TILE / 2,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// ------------------------------------------------------------
// GENERAZIONE COMPLETA
// ------------------------------------------------------------

function generate() {

    const settings = getSettings();

    /*
        1. MATRICE DELLE STANZE
    */

    const roomData = generateRooms(settings);

    const roomMatrix = roomData.matrix;
    const rooms = roomData.rooms;

    /*
        Se abbiamo troppo poche stanze,
        non ha senso procedere.
    */

    if (rooms.length < 2) {

        document.getElementById("stats").textContent =
            "Impossibile generare abbastanza stanze.";

        return;
    }

    /*
        2. DELAUNAY
    */

    const delaunayEdges = delaunay(rooms);

    /*
        3. MST
    */

    const mst = minimumSpanningTree(
        delaunayEdges,
        rooms
    );

    /*
        4. MATRICE DEI CORRIDOI
    */

    const corridorData = generateCorridors(
        rooms,
        delaunayEdges,
        mst,
        settings
    );

    const corridorMatrix = corridorData.matrix;

    /*
        5. MATRICE FINALE

        I corridoi sovrascrivono le stanze.
    */

    const finalMatrix = combineMatrices(
        roomMatrix,
        corridorMatrix
    );

    /*
        6. RENDER
    */

    render(
        finalMatrix,
        rooms
    );

    /*
        STATISTICHE
    */

    document.getElementById("stats").textContent =
        `Stanze: ${rooms.length} | ` +
        `Archi Delaunay: ${delaunayEdges.length} | ` +
        `Corridoi MST: ${mst.length} | ` +
        `Corridoi extra: ${corridorData.extraCount} ` +
        `(${corridorData.percentage.toFixed(1)}%)`;
}


// ------------------------------------------------------------
// AVVIO
// ------------------------------------------------------------

generate();

</script>

</body>
</html>
