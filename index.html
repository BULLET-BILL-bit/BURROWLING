<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burrow Generator</title>

<style>
    body {
        margin: 0;
        padding: 20px;
        background: #181818;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-top: 0;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 10px 20px;
        max-width: 700px;
        margin-bottom: 20px;
    }

    .control {
        display: grid;
        grid-template-columns: 1fr 70px 70px;
        gap: 6px;
        align-items: center;
    }

    .control label {
        font-size: 14px;
    }

    input {
        width: 60px;
        box-sizing: border-box;
        background: #292929;
        color: white;
        border: 1px solid #555;
        padding: 5px;
    }

    button {
        background: #ddd;
        color: #111;
        border: 0;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
    }

    button:hover {
        background: white;
    }

    #stats {
        margin-bottom: 15px;
        font-size: 14px;
        color: #aaa;
    }

    #canvas {
        width: 1024px;
        height: 1024px;
        max-width: 90vw;
        max-height: 90vw;
        image-rendering: pixelated;
        border: 1px solid #444;
        display: block;
    }
</style>
</head>

<body>

<h1>Burrow Generator</h1>

<div class="controls">

    <div class="control">
        <label>Numero stanze</label>
        <input id="roomsMin" type="number" value="6">
        <input id="roomsMax" type="number" value="18">
    </div>

    <div class="control">
        <label>Altezza sopra</label>
        <input id="upMin" type="number" value="0">
        <input id="upMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Altezza sotto</label>
        <input id="downMin" type="number" value="0">
        <input id="downMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Distanza destra</label>
        <input id="rightMin" type="number" value="0">
        <input id="rightMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Distanza sinistra</label>
        <input id="leftMin" type="number" value="0">
        <input id="leftMax" type="number" value="2">
    </div>

    <div class="control">
        <label>Corridoi extra %</label>
        <input id="extraMin" type="number" value="0">
        <input id="extraMax" type="number" value="25">
    </div>

</div>

<button onclick="generate()">GENERA BURROW</button>

<div id="stats"></div>

<canvas id="canvas" width="1024" height="1024"></canvas>


<script>

const GRID = 32;
const TILE = 32;


// ------------------------------------------------------------
// TILESET
// ------------------------------------------------------------

const TILESET_PATH = "TILESETtest01.png";

const TILESET_TILE = 32;
const TILESET_GAP = 16;
const TILESET_BORDER = 16;

const tilesetImage = new Image();
let tilesetReady = false;

tilesetImage.onload = function() {
    tilesetReady = true;
    generate();
};

tilesetImage.onerror = function() {
    console.error("Impossibile caricare " + TILESET_PATH);
};

tilesetImage.src = TILESET_PATH;


// ------------------------------------------------------------
// MATRICE
// ------------------------------------------------------------

const EMPTY = 0;
const ROOM = 1;
const CORRIDOR = 2;


// ------------------------------------------------------------
// UTILITÀ
// ------------------------------------------------------------

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomFloat(min, max) {
    return Math.random() * (max - min) + min;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

function createMatrix(value = EMPTY) {
    return Array.from(
        { length: GRID },
        () => Array(GRID).fill(value)
    );
}


// ------------------------------------------------------------
// LETTURA PARAMETRI
// ------------------------------------------------------------

function getSettings() {

    function range(minId, maxId) {

        let min = Number(
            document.getElementById(minId).value
        );

        let max = Number(
            document.getElementById(maxId).value
        );

        if (min > max) {
            [min, max] = [max, min];
        }

        return {
            min,
            max
        };
    }

    return {
        rooms: range("roomsMin", "roomsMax"),
        up: range("upMin", "upMax"),
        down: range("downMin", "downMax"),
        right: range("rightMin", "rightMax"),
        left: range("leftMin", "leftMax"),
        extra: range("extraMin", "extraMax")
    };
}


// ------------------------------------------------------------
// GENERAZIONE STANZE
// ------------------------------------------------------------

function generateRooms(settings) {

    const roomMatrix = createMatrix();
    const rooms = [];

    const targetRooms = randomInt(
        settings.rooms.min,
        settings.rooms.max
    );

    /*
        Generiamo ESATTAMENTE il numero di stanze richiesto.

        Le stanze possono compenetrarsi.

        L'unico vincolo è che due stanze non abbiano
        lo stesso centroide.
    */

    const usedCentroids = new Set();

    while (rooms.length < targetRooms) {

        const up = randomInt(
            settings.up.min,
            settings.up.max
        );

        const down = randomInt(
            settings.down.min,
            settings.down.max
        );

        const left = randomInt(
            settings.left.min,
            settings.left.max
        );

        const right = randomInt(
            settings.right.min,
            settings.right.max
        );

        /*
            Il centroide è una cella vera e propria.

            Lasciamo una cella di margine dal bordo.
        */

        const minX = left + 1;
        const maxX = GRID - right - 2;

        const minY = up + 1;
        const maxY = GRID - down - 2;

        if (minX > maxX || minY > maxY) {
            continue;
        }

        const cx = randomInt(minX, maxX);
        const cy = randomInt(minY, maxY);

        const centroidKey = `${cx}-${cy}`;

        if (usedCentroids.has(centroidKey)) {
            continue;
        }

        usedCentroids.add(centroidKey);

        /*
            La stanza viene scritta direttamente nella matrice.

            Se si sovrappone a una stanza precedente,
            riscrive semplicemente quelle celle.
        */

        for (
            let y = cy - up;
            y <= cy + down;
            y++
        ) {

            for (
                let x = cx - left;
                x <= cx + right;
                x++
            ) {

                roomMatrix[y][x] = ROOM;
            }
        }

        rooms.push({
            x: cx,
            y: cy,
            up,
            down,
            left,
            right
        });
    }

    return {
        matrix: roomMatrix,
        rooms
    };
}


// ------------------------------------------------------------
// DELAUNAY
// ------------------------------------------------------------

function circumcircle(a, b, c) {

    const A = b.x - a.x;
    const B = b.y - a.y;
    const C = c.x - a.x;
    const D = c.y - a.y;

    const E =
        A * (a.x + b.x) +
        B * (a.y + b.y);

    const F =
        C * (a.x + c.x) +
        D * (a.y + c.y);

    const G =
        2 * (
            A * (c.y - b.y) -
            B * (c.x - b.x)
        );

    if (Math.abs(G) < 0.000001) {
        return null;
    }

    const ux =
        (D * E - B * F) / G;

    const uy =
        (A * F - C * E) / G;

    const dx = ux - a.x;
    const dy = uy - a.y;

    return {
        x: ux,
        y: uy,
        r2: dx * dx + dy * dy
    };
}


function delaunay(points) {

    if (points.length < 2) {
        return [];
    }

    if (points.length === 2) {
        return [{
            a: 0,
            b: 1
        }];
    }

    const pts = points.map((p, i) => ({
        x: p.x,
        y: p.y,
        original: i
    }));

    const superA = {
        x: -1000,
        y: -1000,
        original: -1
    };

    const superB = {
        x: 1000,
        y: -1000,
        original: -2
    };

    const superC = {
        x: 0,
        y: 1000,
        original: -3
    };

    pts.push(
        superA,
        superB,
        superC
    );

    const n = points.length;

    let triangles = [
        [n, n + 1, n + 2]
    ];

    for (let i = 0; i < n; i++) {

        const p = pts[i];

        const bad = [];

        for (
            let t = 0;
            t < triangles.length;
            t++
        ) {

            const tri = triangles[t];

            const circle = circumcircle(
                pts[tri[0]],
                pts[tri[1]],
                pts[tri[2]]
            );

            if (!circle) {
                continue;
            }

            const dx = p.x - circle.x;
            const dy = p.y - circle.y;

            if (
                dx * dx + dy * dy <=
                circle.r2 + 0.000001
            ) {
                bad.push(t);
            }
        }

        const edgeMap = new Map();

        for (const tIndex of bad) {

            const tri = triangles[tIndex];

            const edges = [
                [tri[0], tri[1]],
                [tri[1], tri[2]],
                [tri[2], tri[0]]
            ];

            for (const edge of edges) {

                const a = Math.min(
                    edge[0],
                    edge[1]
                );

                const b = Math.max(
                    edge[0],
                    edge[1]
                );

                const key = `${a}-${b}`;

                edgeMap.set(
                    key,
                    (edgeMap.get(key) || 0) + 1
                );
            }
        }

        triangles = triangles.filter(
            (_, index) => !bad.includes(index)
        );

        for (const [key, count] of edgeMap) {

            if (count !== 1) {
                continue;
            }

            const [a, b] =
                key.split("-").map(Number);

            triangles.push([
                a,
                b,
                i
            ]);
        }
    }

    const edges = new Set();

    for (const tri of triangles) {

        if (
            tri[0] >= n ||
            tri[1] >= n ||
            tri[2] >= n
        ) {
            continue;
        }

        const triEdges = [
            [tri[0], tri[1]],
            [tri[1], tri[2]],
            [tri[2], tri[0]]
        ];

        for (const [a, b] of triEdges) {

            const min = Math.min(a, b);
            const max = Math.max(a, b);

            edges.add(`${min}-${max}`);
        }
    }

    return [...edges].map(key => {

        const [a, b] =
            key.split("-").map(Number);

        return {
            a,
            b
        };
    });
}


// ------------------------------------------------------------
// DISTANZA
// ------------------------------------------------------------

function distance(a, b) {

    const dx = a.x - b.x;
    const dy = a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


// ------------------------------------------------------------
// MINIMUM SPANNING TREE
// ------------------------------------------------------------

function minimumSpanningTree(
    edges,
    rooms
) {

    const sorted = [...edges].sort(
        (e1, e2) => {

            const d1 = distance(
                rooms[e1.a],
                rooms[e1.b]
            );

            const d2 = distance(
                rooms[e2.a],
                rooms[e2.b]
            );

            return d1 - d2;
        }
    );

    const parent =
        rooms.map((_, i) => i);

    function find(x) {

        while (parent[x] !== x) {

            parent[x] =
                parent[parent[x]];

            x = parent[x];
        }

        return x;
    }

    function union(a, b) {

        const ra = find(a);
        const rb = find(b);

        if (ra === rb) {
            return false;
        }

        parent[rb] = ra;

        return true;
    }

    const mst = [];

    for (const edge of sorted) {

        if (
            union(
                edge.a,
                edge.b
            )
        ) {
            mst.push(edge);
        }
    }

    return mst;
}


// ------------------------------------------------------------
// CORRIDOI
// ------------------------------------------------------------

function drawCorridor(
    matrix,
    a,
    b
) {

    let x = a.x;
    let y = a.y;

    matrix[y][x] = CORRIDOR;

    // Orizzontale
    while (x !== b.x) {

        if (x < b.x) {
            x++;
        } else {
            x--;
        }

        matrix[y][x] = CORRIDOR;
    }

    // Verticale
    while (y !== b.y) {

        if (y < b.y) {
            y++;
        } else {
            y--;
        }

        matrix[y][x] = CORRIDOR;
    }
}


function generateCorridors(
    rooms,
    delaunayEdges,
    mst,
    settings
) {

    const corridorMatrix =
        createMatrix();

    for (const edge of mst) {

        drawCorridor(
            corridorMatrix,
            rooms[edge.a],
            rooms[edge.b]
        );
    }

    const mstKeys = new Set(
        mst.map(e => {

            const a = Math.min(
                e.a,
                e.b
            );

            const b = Math.max(
                e.a,
                e.b
            );

            return `${a}-${b}`;
        })
    );

    const excluded =
        delaunayEdges.filter(e => {

            const a = Math.min(
                e.a,
                e.b
            );

            const b = Math.max(
                e.a,
                e.b
            );

            return !mstKeys.has(
                `${a}-${b}`
            );
        });

    const percentage =
        randomFloat(
            settings.extra.min,
            settings.extra.max
        );

    const extraCount =
        Math.floor(
            excluded.length *
            percentage /
            100
        );

    shuffle(excluded);

    const extras =
        excluded.slice(
            0,
            extraCount
        );

    for (const edge of extras) {

        drawCorridor(
            corridorMatrix,
            rooms[edge.a],
            rooms[edge.b]
        );
    }

    return {
        matrix: corridorMatrix,
        extraCount,
        percentage
    };
}


// ------------------------------------------------------------
// MATRICE FINALE
// ------------------------------------------------------------

function combineMatrices(
    roomMatrix,
    corridorMatrix
) {

    const finalMatrix =
        roomMatrix.map(
            row => [...row]
        );

    for (
        let y = 0;
        y < GRID;
        y++
    ) {

        for (
            let x = 0;
            x < GRID;
            x++
        ) {

            if (
                corridorMatrix[y][x] ===
                CORRIDOR
            ) {
                finalMatrix[y][x] =
                    CORRIDOR;
            }
        }
    }

    return finalMatrix;
}


// ------------------------------------------------------------
// CONNESSIONI PER LA RIGA
// ------------------------------------------------------------

/*
    ATTENZIONE:

    Per scegliere la RIGA del tileset:

    0 = esiste una casella adiacente
        (ROOM oppure CORRIDOR)

    1 = non esiste una casella adiacente
        (EMPTY / roccia)

    Quindi qui NON ci interessa se il vicino
    è stanza o corridoio.
*/

function isOccupied(
    matrix,
    x,
    y
) {

    if (
        x < 0 ||
        x >= GRID ||
        y < 0 ||
        y >= GRID
    ) {
        return false;
    }

    return matrix[y][x] !== EMPTY;
}


function getConnections(
    matrix,
    x,
    y
) {

    return {

        N: isOccupied(
            matrix,
            x,
            y - 1
        ),

        E: isOccupied(
            matrix,
            x + 1,
            y
        ),

        S: isOccupied(
            matrix,
            x,
            y + 1
        ),

        W: isOccupied(
            matrix,
            x - 1,
            y
        )
    };
}


function getRowFromConnections(
    connections
) {

    /*
        0 = apertura / altra casella
        1 = parete / roccia

        Ordine:

        N E S W
    */

    const key =
        (connections.N ? "0" : "1") +
        (connections.E ? "0" : "1") +
        (connections.S ? "0" : "1") +
        (connections.W ? "0" : "1");


    /*
        Matrice del TILESET

        1  = 0000
        2  = 0001
        3  = 0010
        4  = 0011
        5  = 0100
        6  = 0101
        7  = 0110
        8  = 0111
        9  = 1000
        10 = 1001
        11 = 1010
        12 = 1011
        13 = 1100
        14 = 1101
        15 = 1110
        16 = roccia piena

        1111 non viene utilizzata.
    */

    const rows = {

        "0000": 1,
        "0001": 2,
        "0010": 3,
        "0011": 4,
        "0100": 5,
        "0101": 6,
        "0110": 7,
        "0111": 8,
        "1000": 9,
        "1001": 10,
        "1010": 11,
        "1011": 12,
        "1100": 13,
        "1101": 14,
        "1110": 15
    };

    return rows[key];
}


// ------------------------------------------------------------
// CONNESSIONI DEI CORRIDOI
// ------------------------------------------------------------

/*
    Per la scelta della COLONNA invece
    distinguiamo realmente i corridoi.

    Qui ROOM e EMPTY sono entrambi "non corridoio".
*/

function isCorridor(
    matrix,
    x,
    y
) {

    if (
        x < 0 ||
        x >= GRID ||
        y < 0 ||
        y >= GRID
    ) {
        return false;
    }

    return matrix[y][x] === CORRIDOR;
}


// ------------------------------------------------------------
// SCELTA COLONNA
// ------------------------------------------------------------

function getColumn(
    matrix,
    x,
    y
) {

    const value =
        matrix[y][x];


    /*
        ROCCIA PIENA

        Tutte le 12 colonne
        sono disponibili.
    */

    if (value === EMPTY) {

        return randomInt(
            1,
            12
        );
    }


    /*
        STANZA

        Colonne 1-4.
    */

    if (value === ROOM) {

        return randomInt(
            1,
            4
        );
    }


    /*
        CORRIDOIO

        Qui guardiamo SOLO
        i corridoi adiacenti.
    */

    const N =
        isCorridor(
            matrix,
            x,
            y - 1
        );

    const E =
        isCorridor(
            matrix,
            x + 1,
            y
        );

    const S =
        isCorridor(
            matrix,
            x,
            y + 1
        );

    const W =
        isCorridor(
            matrix,
            x - 1,
            y
        );


    /*
        CASO 2

        Almeno uno tra E, W, S
        è corridoio

        N NON è corridoio

        → colonne 5-8
    */

    if (
        !N &&
        (E || W || S)
    ) {

        return randomInt(
            5,
            8
        );
    }


    /*
        CASO 3

        N è corridoio

        e almeno uno tra E/W
        è corridoio

        → colonne 9-10
    */

    if (
        N &&
        (E || W)
    ) {

        return randomInt(
            9,
            10
        );
    }


    /*
        CASO 4

        N è corridoio

        E NON è corridoio

        W NON è corridoio

        → colonne 11-12
    */

    if (
        N &&
        !E &&
        !W
    ) {

        return randomInt(
            11,
            12
        );
    }


    /*
        Un corridoio isolato
        non dovrebbe esistere.

        Fallback di sicurezza.
    */

    return randomInt(
        5,
        8
    );
}


// ------------------------------------------------------------
// DISEGNO TILESET
// ------------------------------------------------------------

function drawTile(
    ctx,
    row,
    column,
    destX,
    destY
) {

    /*
        row e column sono 1-based.

        TILE:
        32x32

        GAP:
        16

        BORDER:
        16
    */

    const sourceX =
        TILESET_BORDER +
        (column - 1) *
        (
            TILESET_TILE +
            TILESET_GAP
        );

    const sourceY =
        TILESET_BORDER +
        (row - 1) *
        (
            TILESET_TILE +
            TILESET_GAP
        );

    ctx.drawImage(

        tilesetImage,

        sourceX,
        sourceY,

        TILESET_TILE,
        TILESET_TILE,

        destX,
        destY,

        TILE,
        TILE
    );
}


// ------------------------------------------------------------
// RENDER
// ------------------------------------------------------------

function render(
    matrix,
    rooms
) {

    const canvas =
        document.getElementById(
            "canvas"
        );

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Disegniamo ogni cella.
    */

    for (
        let y = 0;
        y < GRID;
        y++
    ) {

        for (
            let x = 0;
            x < GRID;
            x++
        ) {

            const value =
                matrix[y][x];

            let row;
            let column;


            /*
                ROCCIA
            */

            if (value === EMPTY) {

                row = 16;

                column =
                    randomInt(
                        1,
                        12
                    );
            }


            /*
                STANZA
            */

            else if (value === ROOM) {

                /*
                    Per la riga guardiamo
                    ROOM + CORRIDOR.
                */

                const connections =
                    getConnections(
                        matrix,
                        x,
                        y
                    );

                row =
                    getRowFromConnections(
                        connections
                    );

                /*
                    La stanza usa
                    colonne 1-4.
                */

                column =
                    randomInt(
                        1,
                        4
                    );
            }


            /*
                CORRIDOIO
            */

            else if (
                value === CORRIDOR
            ) {

                /*
                    Anche per il corridoio
                    la RIGA dipende dalla
                    presenza di qualsiasi
                    casella adiacente.

                    ROOM o CORRIDOR
                    non fa differenza.
                */

                const connections =
                    getConnections(
                        matrix,
                        x,
                        y
                    );

                row =
                    getRowFromConnections(
                        connections
                    );


                /*
                    La COLONNA invece
                    viene decisa separatamente
                    guardando SOLO i corridoi.
                */

                column =
                    getColumn(
                        matrix,
                        x,
                        y
                    );
            }


            drawTile(
                ctx,
                row,
                column,
                x * TILE,
                y * TILE
            );
        }
    }
}


// ------------------------------------------------------------
// GENERAZIONE COMPLETA
// ------------------------------------------------------------

function generate() {

    /*
        Se il tileset non è ancora pronto,
        aspettiamo.
    */

    if (!tilesetReady) {
        return;
    }


    const settings =
        getSettings();


    /*
        1.
        GENERAZIONE STANZE
    */

    const roomData =
        generateRooms(
            settings
        );

    const roomMatrix =
        roomData.matrix;

    const rooms =
        roomData.rooms;


    /*
        2.
        DELAUNAY
    */

    const delaunayEdges =
        delaunay(
            rooms
        );


    /*
        3.
        MINIMUM SPANNING TREE
    */

    const mst =
        minimumSpanningTree(
            delaunayEdges,
            rooms
        );


    /*
        4.
        GENERAZIONE CORRIDOI
    */

    const corridorData =
        generateCorridors(
            rooms,
            delaunayEdges,
            mst,
            settings
        );

    const corridorMatrix =
        corridorData.matrix;


    /*
        5.
        MATRICE FINALE

        I corridoi sovrascrivono
        le stanze.
    */

    const finalMatrix =
        combineMatrices(
            roomMatrix,
            corridorMatrix
        );


    /*
        6.
        RENDER
    */

    render(
        finalMatrix,
        rooms
    );


    /*
        STATISTICHE
    */

    document.getElementById(
        "stats"
    ).textContent =

        `Stanze: ${rooms.length} | ` +
        `Archi Delaunay: ${delaunayEdges.length} | ` +
        `Corridoi MST: ${mst.length} | ` +
        `Corridoi extra: ${corridorData.extraCount} ` +
        `(${corridorData.percentage.toFixed(1)}%)`;
}


// ------------------------------------------------------------
// AVVIO
// ------------------------------------------------------------

/*
    generate() viene chiamato
    automaticamente quando il tileset
    è stato caricato.
*/

</script>
